name: Build NSFWgram

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Select Xcode
        run: |
          set -x
          XCODE_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["xcode"]);')
          if [ -d "/Applications/Xcode_$XCODE_VERSION.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_$XCODE_VERSION.app/Contents/Developer"
          else
            echo "Xcode $XCODE_VERSION is not installed on the runner, falling back to the newest available Xcode"
            ls -d /Applications/Xcode*.app || true
            LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
            sudo xcode-select -s "$LATEST/Contents/Developer"
          fi
          xcodebuild -version

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          sudo cp -R "$GITHUB_WORKSPACE" /Users/Shared/
          sudo mv "/Users/Shared/$(basename "$GITHUB_WORKSPACE")" /Users/Shared/telegram-ios

      - name: Build the App (unsigned)
        run: |
          set -x

          # source code paths are included in the final binary, so we need them stable across builds
          SOURCE_DIR=/Users/Shared/telegram-ios

          # use canonical bazel root
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export BUILD_NUMBER="$((COMMIT_COUNT+BUILD_NUMBER_OFFSET))"
          echo "BUILD_NUMBER=$(echo $BUILD_NUMBER)" >> $GITHUB_ENV
          echo "APP_VERSION=$(echo $APP_VERSION)" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            --outputBuildArtifactsPath="build/artifacts"

      - name: Rename artifacts
        run: |
          set -x
          cd /Users/Shared/telegram-ios/build/artifacts
          mv Swiftgram.ipa NSFWgram.ipa
          mv Swiftgram.DSYMs.zip NSFWgram.DSYMs.zip || true
          ls -la

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NSFWgram-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/artifacts/*
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nsfwgram-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          name: NSFWgram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          body: |
            Unsigned build of NSFWgram (fork of Swiftgram / Telegram-iOS).

            The IPA is **unsigned** — sign it before installing:
            * Sideloadly (Windows/macOS) with any Apple ID — free, valid 7 days
            * AltStore / SideStore
            * esign / Scarlet with a certificate
            * TrollStore (iOS 14.0–16.6.1)

            NSFWgram removes App Store content restrictions: sensitive (18+) content is always shown,
            and chats/bots hidden "due to App Store Guidelines" are unlocked.
          files: |
            /Users/Shared/telegram-ios/build/artifacts/*
